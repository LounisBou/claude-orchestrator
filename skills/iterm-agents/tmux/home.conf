# home.conf - the configuration of an orchestrator's home server, and of nothing else: the
# launcher starts each home server with `-f` on this file, so the operator's own tmux setup is
# neither read here nor touched.

# The mark the launcher reads on the caller's pane: in a session that carries it, an agent is
# a window of that session. Set on each session as it is made, since the launcher reads the
# session's own option and not the global one.
set-hook -g session-created "set-option @orchestrator-home 1"

# The host reads focus changes and the modified keys: Shift-Enter inserts a newline instead of
# submitting only when tmux passes it on as an extended key, and asks the terminal for them.
set -g focus-events on
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# A window keeps the name the launcher gave it: renamed after its program, it would read the
# host's version number.
set -g automatic-rename off
set -g mouse on

# The iTerm2 tab reads the title of the window it shows, the host's own title with its glyph.
set -g set-titles on
set -g set-titles-string '#T'

# The default prefix, and a second press sends it through to the program in the pane.
set -g prefix C-b
bind C-b send-prefix

# The tab bar: each window is a button-like block (its own background, a space of padding on
# each side) showing its name and, once its session has written a state, that state's icon
# after the name: busy ●, idle ○, asks ✋, done ✓, gate ⚠. The module writes the state word in
# @state on its own window when it changes; the status line only maps it to an icon, nothing
# polls, and a window with no state, or one this map does not know, shows no icon. Clicking a
# block selects its window through tmux's default MouseDown1Status binding, left alone. Colours
# are plain #rrggbb, every pair at least 7:1 (WCAG AAA): bar #ffffff on #1c1c1c 17.0, inactive
# #e4e4e4 on #303030 10.4, current #000000 on #ffd75f 15.1. Each icon has a colour per block,
# since one colour holds 7:1 on a dark block or on the yellow one, not both. On #303030: busy
# #87d7ff 8.3, idle #d0d0d0 8.6, asks #ffaf5f 7.3, done #87ff87 10.5, gate #ffafaf 7.5. On
# #ffd75f: busy #003f5f 8.1, idle #3a3a3a 8.2, asks #5f0087 8.2, done #004d00 7.3, gate
# #870000 7.5. No index: it only added noise.
set -g status-style 'fg=#ffffff,bg=#1c1c1c'
# The session name is of no use here: one session, named by the launcher.
set -g status-left ''
# Nor the right end: the pane title repeats the window's own block, and a clock means nothing here.
set -g status-right ''
# One plain space between two blocks lets the bar show through, so neighbours never read as one.
set -g window-status-separator ' '
set -g window-status-format '#[fg=#e4e4e4,bg=#303030] #W#{?#{==:#{@state},busy}, #[fg=#87d7ff]●,#{?#{==:#{@state},idle}, #[fg=#d0d0d0]○,#{?#{==:#{@state},asks}, #[fg=#ffaf5f]✋,#{?#{==:#{@state},done}, #[fg=#87ff87]✓,#{?#{==:#{@state},gate}, #[fg=#ffafaf]⚠,}}}}} #[default]'
# The current window is bold on a brighter background, with icon colours of its own: the inactive
# ones would not hold 7:1 on it.
set -g window-status-current-format '#[fg=#000000,bg=#ffd75f,bold] #W#{?#{==:#{@state},busy}, #[fg=#003f5f]●,#{?#{==:#{@state},idle}, #[fg=#3a3a3a]○,#{?#{==:#{@state},asks}, #[fg=#5f0087]✋,#{?#{==:#{@state},done}, #[fg=#004d00]✓,#{?#{==:#{@state},gate}, #[fg=#870000]⚠,}}}}} #[default]'
